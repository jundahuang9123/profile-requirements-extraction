name: Offline ontology context tests
on: [push, pull_request]
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-context-tests.txt
      - run: python -m pip install -r requirements-context-tests.txt
      - run: python -m unittest discover -s tests -v
